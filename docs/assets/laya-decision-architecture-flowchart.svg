<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Icarus decision architecture with Laya as the learned decision selector</title>
  <desc id="desc">A flowchart showing deterministic mission compilation and candidate construction feeding Laya for a small choice, then deterministic validation, guardrails, execution, safety supervision, and flight control. Safety-critical responsibilities never belong to Laya.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#466275"/></marker>
    <marker id="safeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker>
    <style>
      .bg { fill:#f6f9fc; }
      .title { font: 700 39px Arial, sans-serif; fill:#102a43; }
      .subtitle { font: 400 20px Arial, sans-serif; fill:#486581; }
      .lane { font: 700 18px Arial, sans-serif; letter-spacing:1.5px; fill:#486581; }
      .box-title { font: 700 22px Arial, sans-serif; fill:#102a43; }
      .box-text { font: 400 17px Arial, sans-serif; fill:#334e68; }
      .box-small { font: 400 15px Arial, sans-serif; fill:#486581; }
      .tag { font: 700 14px Arial, sans-serif; letter-spacing:.7px; fill:#fff; }
      .note-title { font:700 19px Arial, sans-serif; fill:#7a271a; }
      .note { font:400 16px Arial, sans-serif; fill:#7a271a; }
      .arrow { stroke:#466275; stroke-width:4; fill:none; marker-end:url(#arrow); }
      .safe { stroke:#b42318; stroke-width:4; fill:none; marker-end:url(#safeArrow); }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1120"/>
  <text class="title" x="900" y="65" text-anchor="middle">Icarus: where Laya can make decisions</text>
  <text class="subtitle" x="900" y="98" text-anchor="middle">Laya can be the only learned selector—not the only authority in the flight system.</text>

  <text class="lane" x="82" y="164">DETERMINISTIC MISSION AND ACTION CONSTRUCTION</text>
  <line x1="82" y1="178" x2="1718" y2="178" stroke="#cbd5e1" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="90" y="220" width="260" height="165" rx="18" fill="#ffffff" stroke="#b8c9d8" stroke-width="2"/>
    <rect x="108" y="239" width="115" height="27" rx="13" fill="#466275"/><text class="tag" x="165" y="258" text-anchor="middle">OPERATOR</text>
    <text class="box-title" x="220" y="302" text-anchor="middle">Mission request</text>
    <text class="box-text" x="220" y="333" text-anchor="middle">“Inspect, count,</text><text class="box-text" x="220" y="356" text-anchor="middle">then return home.”</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="220" width="340" height="165" rx="18" fill="#e9f5ff" stroke="#2b7bbb" stroke-width="2.5"/>
    <rect x="470" y="239" width="183" height="27" rx="13" fill="#2b7bbb"/><text class="tag" x="561" y="258" text-anchor="middle">DETERMINISTIC</text>
    <text class="box-title" x="620" y="302" text-anchor="middle">Objective compiler</text>
    <text class="box-text" x="620" y="333" text-anchor="middle">Parse clauses, order work,</text><text class="box-text" x="620" y="356" text-anchor="middle">supply reviewed parameters</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="890" y="220" width="365" height="165" rx="18" fill="#e9f5ff" stroke="#2b7bbb" stroke-width="2.5"/>
    <rect x="910" y="239" width="183" height="27" rx="13" fill="#2b7bbb"/><text class="tag" x="1001" y="258" text-anchor="middle">DETERMINISTIC</text>
    <text class="box-title" x="1072" y="302" text-anchor="middle">Candidate factory</text>
    <text class="box-text" x="1072" y="333" text-anchor="middle">Make fewer than 10 complete,</text><text class="box-text" x="1072" y="356" text-anchor="middle">policy-valid action options</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1355" y="220" width="355" height="165" rx="18" fill="#fff4e5" stroke="#d97706" stroke-width="3"/>
    <rect x="1375" y="239" width="75" height="27" rx="13" fill="#d97706"/><text class="tag" x="1412" y="258" text-anchor="middle">LAYA</text>
    <text class="box-title" x="1532" y="302" text-anchor="middle">System-1 selector</text>
    <text class="box-text" x="1532" y="333" text-anchor="middle">Choose a candidate /</text><text class="box-text" x="1532" y="356" text-anchor="middle">return risk or confidence</text>
  </g>
  <path class="arrow" d="M350 302 H450"/><path class="arrow" d="M790 302 H890"/><path class="arrow" d="M1255 302 H1355"/>
  <text class="box-small" x="1325" y="287" text-anchor="end">curated state + candidate IDs</text>

  <text class="lane" x="82" y="489">INDEPENDENT EXECUTION AND SAFETY AUTHORITY</text>
  <line x1="82" y1="503" x2="1718" y2="503" stroke="#cbd5e1" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="130" y="550" width="305" height="172" rx="18" fill="#edf7ef" stroke="#38804c" stroke-width="2.5"/>
    <rect x="150" y="569" width="183" height="27" rx="13" fill="#38804c"/><text class="tag" x="241" y="588" text-anchor="middle">DETERMINISTIC</text>
    <text class="box-title" x="282" y="632" text-anchor="middle">Validate selection</text>
    <text class="box-text" x="282" y="663" text-anchor="middle">Schema, freshness, objective</text><text class="box-text" x="282" y="686" text-anchor="middle">order, parameter equality</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="525" y="550" width="305" height="172" rx="18" fill="#edf7ef" stroke="#38804c" stroke-width="2.5"/>
    <rect x="545" y="569" width="183" height="27" rx="13" fill="#38804c"/><text class="tag" x="636" y="588" text-anchor="middle">DETERMINISTIC</text>
    <text class="box-title" x="677" y="632" text-anchor="middle">Guardrails</text>
    <text class="box-text" x="677" y="663" text-anchor="middle">State preconditions, geofence,</text><text class="box-text" x="677" y="686" text-anchor="middle">limits, collision constraints</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="920" y="550" width="305" height="172" rx="18" fill="#edf7ef" stroke="#38804c" stroke-width="2.5"/>
    <rect x="940" y="569" width="183" height="27" rx="13" fill="#38804c"/><text class="tag" x="1031" y="588" text-anchor="middle">DETERMINISTIC</text>
    <text class="box-title" x="1072" y="632" text-anchor="middle">Mission executor</text>
    <text class="box-text" x="1072" y="663" text-anchor="middle">Idempotency, action lifecycle,</text><text class="box-text" x="1072" y="686" text-anchor="middle">deadline and cancellation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1315" y="550" width="305" height="172" rx="18" fill="#fef0ef" stroke="#b42318" stroke-width="3"/>
    <rect x="1335" y="569" width="175" height="27" rx="13" fill="#b42318"/><text class="tag" x="1422" y="588" text-anchor="middle">HIGHEST AUTHORITY</text>
    <text class="box-title" x="1467" y="632" text-anchor="middle">Safety supervisor</text>
    <text class="box-text" x="1467" y="663" text-anchor="middle">Hold / RTL / land on faults;</text><text class="box-text" x="1467" y="686" text-anchor="middle">can override every lower layer</text>
  </g>
  <path class="arrow" d="M1532 385 V470 H282 V550"/>
  <path class="arrow" d="M435 636 H525"/><path class="arrow" d="M830 636 H920"/><path class="arrow" d="M1225 636 H1315"/>

  <g filter="url(#shadow)">
    <rect x="667" y="812" width="466" height="148" rx="18" fill="#ffffff" stroke="#466275" stroke-width="2.5"/>
    <text class="box-title" x="900" y="856" text-anchor="middle">ArduPilot flight control → aircraft</text>
    <text class="box-text" x="900" y="888" text-anchor="middle">Only bounded, accepted commands reach the vehicle.</text>
    <text class="box-small" x="900" y="918" text-anchor="middle">Pilot override and flight-controller failsafes remain above Icarus.</text>
  </g>
  <path class="arrow" d="M1072 722 V770 H900 V812"/>
  <path class="safe" d="M1467 722 V770 H1133"/>
  <text class="note" x="1320" y="758" text-anchor="middle">emergency recovery path</text>

  <g>
    <rect x="110" y="820" width="425" height="205" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="note-title" x="140" y="860">Never delegated to Laya</text>
    <text class="note" x="140" y="894">• Mission parsing or coverage decisions</text>
    <text class="note" x="140" y="923">• Coordinates, yaw, orbit or other flight parameters</text>
    <text class="note" x="140" y="952">• Arming permission, guardrail approval or failsafes</text>
    <text class="note" x="140" y="981">• MAVLink commands or motor control</text>
  </g>
  <g>
    <rect x="1260" y="820" width="430" height="205" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="box-title" x="1290" y="860">What Laya can own after proof</text>
    <text class="box-text" x="1290" y="894">• Which safe candidate to try next</text>
    <text class="box-text" x="1290" y="923">• Whether to acquire perception or hold</text>
    <text class="box-text" x="1290" y="952">• Recovery-template or macro selection</text>
    <text class="box-text" x="1290" y="981">• Escalation-risk score for human review</text>
  </g>
  <text class="box-small" x="900" y="1074" text-anchor="middle">Required before any promotion: sealed drone corpus → calibration and safety evaluation → shadow simulation → gated simulator deployment.</text>
</svg>
