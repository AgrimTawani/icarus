schema_version: icarus.safety.v1
profile: simulation_v1

geofence:
  max_altitude_m: 30.0
  max_distance_from_home_m: 100.0
  # Perception-derived targets inherit this same fence. Operators may optionally
  # configure max_runtime_target_distance_from_home_m for a tighter subset.
  action_on_breach: rtl

motion:
  max_horizontal_speed_m_s: 5.0
  max_climb_speed_m_s: 2.5
  max_descent_speed_m_s: 1.5
  max_tilt_deg: 30.0
  # Conservative stopping-envelope assumptions. Sensor age is added live.
  # These must be calibrated for a different aircraft/controller.
  braking_deceleration_mps2: 1.0
  braking_reaction_s: 0.25

battery:
  minimum_takeoff_percent: 50.0
  rtl_percent: 30.0
  land_percent: 20.0

state_health:
  max_state_age_ms: 500
  mavlink_heartbeat_timeout_ms: 2000
  require_attitude: true
  require_altitude: true
  require_ekf_healthy: true
  require_position_for_navigation: true
  require_home_for_takeoff: true

perception:
  maximum_age_ms: 750
  minimum_clearance_m: 2.5
  # Live LiDAR floor while goto/route/orbit/yaw move the aircraft: closer than
  # this means BRAKE and ACTION_STATE_ABORTED_BY_SAFETY. A request may raise
  # it (ActionLimits.minimum_clearance_m), never lower it.
  hard_minimum_clearance_m: 2.0
  emergency_stop_distance_m: 2.5
  failure_action: hold

command:
  acknowledgement_timeout_ms: 2000
  maximum_retries: 1
  reject_unknown_actions: true
  reject_out_of_bounds_arguments: true

failure_actions:
  dcm_timeout: hold
  dcm_invalid_output: hold
  state_stale: hold_then_rtl
  state_stale_rtl_delay_s: 5.0
  # The DCM renews its control lease independently of model inference. If the
  # process dies while airborne, expiry first commands BRAKE, then RTL.
  control_lease_lost_rtl_delay_s: 5.0
  mavlink_loss: rtl
  companion_computer_loss: rtl
  critical_sensor_failure: land_or_rtl

manual_override:
  enabled: true
  operator_has_priority: true
  cancel_autonomous_action: true
  llm_may_disable: false

simulation:
  initial_motor_output_ceiling_percent: 70.0
  episode_timeout_s: 120.0
