syntax = "proto3";

package icarus.v1;

import "icarus/v1/state.proto";

enum SensorFrame {
  SENSOR_FRAME_UNSPECIFIED = 0;
  SENSOR_FRAME_BODY_FLU = 1;
  SENSOR_FRAME_BODY_FRD = 2;
  SENSOR_FRAME_LOCAL_NED = 3;
  SENSOR_FRAME_CAMERA_OPTICAL = 4;
}

message ImageFrameMetadata {
  string sensor_id = 1;
  int64 captured_at_unix_ms = 2;
  SensorFrame frame = 3;
  uint32 width = 4;
  uint32 height = 5;
  string encoding = 6;
  uint64 sequence = 7;
}

message RangePoint {
  double x_m = 1;
  double y_m = 2;
  double z_m = 3;
  double confidence = 4;
}

message RangeScan {
  string sensor_id = 1;
  int64 captured_at_unix_ms = 2;
  int64 received_at_unix_ms = 3;
  SensorFrame frame = 4;
  repeated RangePoint points = 5;
  double minimum_range_m = 6;
  double maximum_range_m = 7;
  uint64 sequence = 8;
}

// Phase 8 carries perception health through DroneState. These normalized
// contracts are reserved for the deterministic Phase 9 perception boundary;
// raw images and point clouds never enter the DCM command interface.
message Detection {
  string detection_id = 1;
  string track_id = 2;
  string classification = 3;
  double confidence = 4;
  Position estimated_position = 5;
  double position_uncertainty_m = 6;
  int64 observed_at_unix_ms = 7;
  string sensor_id = 8;
}

message ObstacleSummary {
  string obstacle_id = 1;
  Position nearest_position = 2;
  double distance_m = 3;
  double relative_bearing_deg = 4;
  double estimated_radius_m = 5;
  double confidence = 6;
  int64 observed_at_unix_ms = 7;
  // LiDAR cluster evidence. Every field below is a geometric measurement of
  // one scan's returns; the cluster producer leaves `confidence` unset because
  // a point-cloud segment has no calibrated probability. Cluster ids are
  // per-scan labels, not persistent tracks.
  uint32 point_count = 8;
  LocalPositionNed centroid = 9;
  double min_north_m = 10;
  double max_north_m = 11;
  double min_east_m = 12;
  double max_east_m = 13;
  // Horizontal convex hull of the member returns in local NED (bounded
  // vertex count); each vertex carries the cluster top as down_m.
  repeated LocalPositionNed hull = 14;
  double top_down_m = 15;
  double bottom_down_m = 16;
  // True when the highest member return lies on the sensor's top elevation
  // ring, or the sensor elevation limit is unknown: the real top may be higher.
  bool top_clipped = 17;
  // Angular span of the hull as seen from the vehicle, relative to its
  // current heading (positive clockwise), in the same frame as
  // relative_bearing_deg.
  double relative_bearing_min_deg = 18;
  double relative_bearing_max_deg = 19;
  string sensor_id = 20;
}

message PerceptionSummary {
  int64 observed_at_unix_ms = 1;
  HealthLevel overall = 2;
  repeated Detection detections = 3;
  repeated ObstacleSummary nearby_obstacles = 4;
  bool local_map_available = 5;
  uint32 local_map_age_ms = 6;
  bool path_ahead_clear = 7;
  double nearest_obstacle_distance_m = 8;
  double nearest_obstacle_bearing_deg = 9;
  double landing_zone_quality = 10;
  uint64 sequence = 11;
  // Clusters found in the latest scan before the nearest-first bound was
  // applied to nearby_obstacles.  The Drone API returns nearby_obstacles only
  // when a request opts in (GetPerceptionRequest.include_nearby_obstacles).
  uint32 obstacle_cluster_total = 12;
}
